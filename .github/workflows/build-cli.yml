name: Build Huawei Firmware CLI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write    # Release بنانے کے لیے ضروری

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            qtbase5-dev \
            qt5-qmake \
            zlib1g-dev

      - name: Build CLI
        run: |
          qmake qhuaweiflash-cli.pro
          make -j$(nproc)
          test -x qhuaweiflash-cli

      - name: Upload CLI binary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-Firmware-CLI-Linux
          path: qhuaweiflash-cli

      - name: Upload CLI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-v1.0.0
          name: "Huawei Firmware CLI v1.0.0"
          body: "Linux x86_64 build of qhuaweiflash-cli"
          files: qhuaweiflash-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
