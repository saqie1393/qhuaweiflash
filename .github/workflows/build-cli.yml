
name: Build Huawei Firmware CLI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            qtbase5-dev \
            qt5-qmake \
            zlib1g-dev

      - name: Build CLI
        run: |
          qmake qhuaweiflash-cli.pro
          make -j$(nproc)

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-Firmware-CLI-Linux
          path: qhuaweiflash-cli
